name: python CI
# Tigger the workflow on any push to the main branch or pull request
on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main
jobs:
    test:
        runs-on: ubuntu-latest
        
         #step1: check out the code from the repository
        steps:
        - name: check out code
          uses: actions/checkout@v2
               #step2: set up python environment
        - name: set up Python
          uses: actions/setup-python@v2
          with:
            python-version: "3.8"
                #step3 : install depenencies
        - name: Install dependencies
          run: |
            python -m pip install --upgrade pip
            pip install -r requirements.txt
            #steps 4: Run tests
        - name: Run tests
          run: python -m pytest

